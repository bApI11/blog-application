<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<body class="container mt-5">
	<!-- Alert Message -->
	<div id="msgBox" th:if="${msg}" class="alert alert-success text-center">
		<span th:text="${msg}"></span>
	</div>

	<script>
	setTimeout(() => {
    const msg = document.getElementById("msgBox");

    if(msg){
        msg.style.transition = "opacity 1s";
        msg.style.opacity = "0";

        setTimeout(() => {
            msg.remove();
        }, 1000);
    }
}, 3000);
</script>

	<nav class="navbar navbar-dark bg-primary">
		<div class="container justify-content-center">
			<span class="navbar-brand fw-bold mb-0 h1"> Create Post </span>
		</div>
	</nav>
	<br>

	<form th:action="@{/post/create}" th:object="${postDto}" method="post">
		<!-- Title -->
		<div class="mb-3">
			<label class="form-label fw-bold"> Title </label> <input type="text"
				class="form-control" th:field="*{title}" placeholder="Enter title">
		</div>
		 
		<!-- Short Description -->
		<div class="mb-3">
			<label class="form-label fw-bold"> Short Description </label> <input
				type="text" class="form-control" th:field="*{shortDescription}"
				placeholder="Enter short description">
		</div>
		 
		<!-- Content -->
		<div class="mb-3">
			<label class="form-label fw-bold"> Content </label>
			<textarea class="form-control" rows="6" th:field="*{content}"
				placeholder="Write your content here...">
</textarea>
		</div>
		 
		<!-- Submit Button -->
		<div class="text-center">
			<button type="submit" class="btn btn-success px-4">Save Post
			</button>
			
			<button type="reset" class="btn btn-secondary px-4">Clear</button>
		</div>
		
	</form>
	
	

</body>
</html>
