<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Blog</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <!-- Blog Content -->
  <div class="mb-4">
    <h2 th:text="${blog.title}">Blog Title</h2>
    <p th:text="${blog.content}">Blog content goes here...</p>
  </div>

  <!-- Comments Section -->
  <div class="mb-4">
    <h4>Comments</h4>
    <div th:each="comment : ${comments}" class="border rounded p-2 mb-2">
      <strong th:text="${comment.author}">Author</strong>
      <p th:text="${comment.text}">Comment text...</p>
    </div>
  </div>

  <!-- Add Comment Form -->
  <div class="mb-4">
    <h4>Add a Comment</h4>
    <form th:action="@{/addComment}" th:object="${newComment}" method="post">
      <div class="mb-3">
        <label for="author" class="form-label">Name</label>
        <input type="text" th:field="*{author}" class="form-control" id="author" placeholder="Enter your name">
      </div>
      <div class="mb-3">
        <label for="text" class="form-label">Comment</label>
        <textarea th:field="*{text}" class="form-control" id="text" rows="3" placeholder="Write your comment"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Comment</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
