<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- Bootstrap 5.3.2 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>

<body class="container mt-5">

	<!-- ================= NAVBAR ================= -->

	<div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>


	<nav class="navbar navbar-expand-lg navbar-light bg-light">

		<div class="container-fluid">

			<!-- Website Name -->
			<a class="navbar-brand" href="#">
				<h4 class="mb-0">Chandra Blog</h4>
			</a>
			<!-- Mobile Menu Button -->
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarMenu"
				aria-controls="navbarMenu" aria-expanded="false"
				aria-label="Toggle navigation">

				<span class="navbar-toggler-icon"></span>

			</button>
			<!-- Navbar Menu -->
			<div class="collapse navbar-collapse" id="navbarMenu">

				<ul class="navbar-nav me-auto mb-2 mb-lg-0">

					<!-- All Post -->
					<li class="nav-item"><a class="nav-link active" href="#">
							All Post </a></li>

					<li class="nav-item"><a class="nav-link active"
						href="/comment/comments"> Comments </a></li>


					<!-- Login -->
					<li class="nav-item"><a class="nav-link" href="/post"> Add
							Post </a></li>


					<!-- Register -->
					<li class="nav-item"><a class="nav-link" href="/user">
							Logout </a></li>

				</ul>
				<!-- Search -->
				<form class="d-flex">

					<input class="form-control me-2" type="search" placeholder="Search"
						aria-label="Search">

					<button class="btn btn-outline-success" type="submit">

						Blog Search</button>
				</form>
			</div>
		</div>
	</nav>
	<br>
	<button class="btn btn-green">All Posts</button>
	<table class="table table-bordered table-striped ">
		<thead class="table-dark">
			<tr>
				<th>ID</th>
				<th>Title</th>
				<th>Short Description</th>
				<th>Content</th>
				<th>Created On</th>
				<th>Action</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="post, stat : ${posts.content}">
				<td th:text="${stat.count}"></td>				
				<td th:text="${post.title}"></td>
				<td th:text="${post.descrip}"></td>
				<td th:text="${post.content}"></td>
				<td th:text="${post.createOn}"></td>
				<td><div class="card-footer">
						<a th:href="@{/post/edit/{id}(id=${post.id})}"
							class="btn btn-warning btn-sm"> Edit </a>   <a
							th:href="@{/post/delete/{id}(id=${post.id})}"
							class="btn btn-danger btn-sm"
							onclick="return confirm('Are you sure you want to delete this post?');">
							Delete </a>
					</div></td>
			</tr>
		</tbody>
	</table>
	<div th:if="${#lists.isEmpty(posts)}"
		class="alert alert-info text-center">No Post Available.</div>
<div>
	<!-- Pagination at bottom -->
	<nav>
		<ul class="pagination justify-content-center">
			 
			<!-- Previous -->
			<li class="page-item" th:classappend="${posts.first} ? 'disabled'">
				  <a class="page-link"
				th:href="@{/post/posts(page=${posts.number-1})}"> Previous </a>
			</li>  
			<!-- Page Numbers -->
			<li class="page-item"
				th:each="i : ${#numbers.sequence(0, posts.totalPages-1)}"
				th:classappend="${i == posts.number} ? 'active'">  <a
				class="page-link" th:text="${i+1}" th:href="@{/post/posts(page=${i})}">
			</a>  
			</li>  
			<!-- Next -->
			<li class="page-item" th:classappend="${posts.last} ? 'disabled'">
				  <a class="page-link"
				th:href="@{/post/posts(page=${posts.number+1})}"> Next </a>  
			</li>  
		</ul>
	</nav>
	 
	</div>

</body>
</html>
